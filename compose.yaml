name: company-registry-demo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: .\init.sql
        target: /docker-entrypoint-initdb.d/001-schema.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d registry"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
